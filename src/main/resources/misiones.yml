# Aldeano de las Esencias - configuración de misiones
# Tras editar este archivo usa:  /clase mision recargar

# Horas que debe esperar un jugador entre una misión y la siguiente
# (el cooldown empieza al completar o abandonar la misión)
cooldown-horas: 12

# Probabilidad (0.0 a 1.0) de recibir esencias al completar una misión.
# 0.40 = 40% de dar esencias, 60% de no dar ninguna.
probabilidad-esencia: 0.40

# Si salen esencias, cuántas (cada una es de una clase aleatoria entre las 6)
esencias-min: 1
esencias-max: 2

# Tipos de misión:
#   KILL     -> objetivo = nombre del mob (EntityType), ej. ZOMBIE
#   MINE     -> objetivo = bloque (Material). DIAMOND_ORE también cuenta DEEPSLATE_DIAMOND_ORE
#   ENTREGAR -> objetivo = ítem (Material) que se le entrega al aldeano (solo ítems normales, sin nombre ni encantamientos)
# Dificultad: DIFICIL o EXTREMA
misiones:
  # ---------------- DIFÍCILES (30) ----------------
